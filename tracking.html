<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Suivi commande · Kote</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#2563EB;--text:#0f0f10;--sub:#9ca3af;--border:#e5e7eb;--bg:#fff;--hover:#f9fafb}
html,body{min-height:100%;font-family:'Inter',sans-serif;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;align-items:center;padding:2.8rem 1.2rem 4rem;min-height:100vh}

.logo-wrap{display:flex;flex-direction:column;align-items:center;gap:.25rem;margin-bottom:2.5rem;opacity:0;animation:up .4s ease forwards}
.logo-svg{height:24px;width:auto}
.logo-tag{font-size:.6rem;font-weight:500;color:var(--sub);letter-spacing:.1em;text-transform:uppercase}

.container{width:100%;max-width:400px;opacity:0;animation:up .4s ease .1s forwards}

.back{display:inline-flex;align-items:center;gap:.3rem;margin-bottom:1.6rem;font-size:.75rem;font-weight:500;color:var(--sub);text-decoration:none;transition:color .12s}
.back:hover{color:var(--text)}
.back svg{width:11px;height:11px}

.eyebrow{font-size:.66rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--sub);margin-bottom:.55rem}
.h1{font-size:1.25rem;font-weight:600;color:var(--text);letter-spacing:-.025em;line-height:1.2;margin-bottom:.3rem}
.sub-txt{font-size:.8rem;color:var(--sub);margin-bottom:1.5rem;line-height:1.55}

.search-row{display:flex;gap:.4rem;margin-bottom:.45rem}
.search-inp{flex:1;border:1px solid var(--border);border-radius:8px;padding:.78rem 1rem;font-family:inherit;font-size:.88rem;color:var(--text);background:var(--bg);outline:none;transition:border-color .14s;text-transform:uppercase;letter-spacing:.06em;-webkit-text-size-adjust:100%}
.search-inp::placeholder{text-transform:none;letter-spacing:0;color:#d1d5db}
.search-inp:focus{border-color:var(--blue)}
.search-btn{padding:.78rem 1.1rem;background:var(--blue);color:#fff;border:none;border-radius:8px;font-family:inherit;font-size:.82rem;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:.4rem;transition:opacity .14s;white-space:nowrap;min-height:44px}
.search-btn:hover{opacity:.88}
.search-btn:disabled{opacity:.4;cursor:not-allowed}
.search-btn svg{width:13px;height:13px;flex-shrink:0}
.search-hint{font-size:.7rem;color:var(--sub)}
.search-hint b{color:#6b7280;font-weight:500}

.tk-error{display:none;margin-top:.7rem;padding:.7rem .9rem;border:1px solid #fecaca;border-radius:8px;font-size:.78rem;color:#dc2626;background:#fef2f2;align-items:flex-start;gap:.5rem}
.tk-error.on{display:flex}
.tk-error svg{width:13px;height:13px;flex-shrink:0;margin-top:.5px}

.tk-spin{display:none;justify-content:center;align-items:center;gap:.45rem;padding:1.4rem 0;font-size:.76rem;color:var(--sub)}
.tk-spin.on{display:flex}
@keyframes spin{to{transform:rotate(360deg)}}
.tk-spin svg{animation:spin .8s linear infinite}

.tk-result{display:none;border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-top:1.4rem}
.tk-result.on{display:block;animation:up .25s ease}

/* result styles */
.tk-card-hdr{padding:1.1rem 1.15rem .9rem;display:flex;align-items:flex-start;justify-content:space-between;gap:.75rem;border-bottom:1px solid var(--border)}
.tk-label{font-size:.62rem;font-weight:500;color:var(--sub);text-transform:uppercase;letter-spacing:.07em;margin-bottom:.25rem}
.tk-ref{font-size:1.05rem;font-weight:600;color:var(--text);font-family:'Courier New',monospace;letter-spacing:.06em;line-height:1}
.tk-date{font-size:.7rem;color:var(--sub);margin-top:.3rem}
.tk-badge{display:inline-flex;align-items:center;font-size:.67rem;font-weight:600;padding:.28rem .7rem;border-radius:20px;border:1px solid;white-space:nowrap}

.tk-timeline{padding:1rem 1.15rem;display:flex;flex-direction:column;border-bottom:1px solid var(--border)}
.tk-step{display:flex;gap:.65rem;align-items:flex-start}
.tk-step-node{display:flex;flex-direction:column;align-items:center;flex-shrink:0}
.tk-step-dot{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--border);background:var(--bg);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#d1d5db;z-index:1}
.tk-step-line{width:1px;background:var(--border);flex:1;min-height:16px;margin:2px 0}
.tk-done .tk-step-dot{background:#059669;border-color:#059669;color:#fff}
.tk-done .tk-step-line{background:#bbf7d0}
.tk-active .tk-step-dot{background:#2563eb;border-color:#2563eb;color:#fff}
.tk-step-body{padding-bottom:14px;flex:1}
.tk-step:last-child .tk-step-body{padding-bottom:0}
.tk-step-lbl{font-size:.8rem;font-weight:500;color:var(--sub);padding-top:.05rem}
.tk-done .tk-step-lbl,.tk-active .tk-step-lbl{color:var(--text)}
.tk-active .tk-step-lbl{font-weight:600}
.tk-step-sub{font-size:.7rem;color:var(--sub);margin-top:.2rem;line-height:1.45}

.tk-section-lbl{padding:.8rem 1.15rem .35rem;font-size:.62rem;font-weight:500;color:var(--sub);text-transform:uppercase;letter-spacing:.07em}
.tk-items{border-bottom:1px solid var(--border)}
.tk-item{display:flex;align-items:baseline;justify-content:space-between;gap:.75rem;padding:.55rem 1.15rem;border-bottom:1px solid var(--border);font-size:.8rem}
.tk-item:last-child{border-bottom:none}
.tk-item-l{display:flex;flex-direction:column;gap:.1rem;min-width:0}
.tk-item-name{font-weight:500;color:var(--text)}
.tk-item-specs{font-size:.68rem;color:var(--sub)}
.tk-item-qty{font-weight:600;color:var(--text);white-space:nowrap;flex-shrink:0;font-size:.76rem}

.tk-totals{padding:.85rem 1.15rem;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:.28rem}
.tk-trow{display:flex;justify-content:space-between;align-items:baseline;font-size:.8rem;color:var(--sub)}
.tk-trow-sub{font-size:.73rem}
.tk-trow-ttc{font-size:.9rem;font-weight:600;color:var(--text);border-top:1px solid var(--border);margin-top:.3rem;padding-top:.5rem}

.tk-actions{padding:.75rem 1.15rem;display:flex;gap:.4rem}
.tk-act-btn{display:flex;align-items:center;gap:.4rem;padding:.65rem 1rem;border:1px solid var(--border);border-radius:7px;font-family:inherit;font-size:.78rem;font-weight:500;color:var(--sub);background:var(--bg);cursor:pointer;transition:all .14s;min-height:44px}
.tk-act-btn:hover{border-color:#9ca3af;color:var(--text)}
.tk-act-btn svg{width:11px;height:11px;flex-shrink:0}

.page-footer{margin-top:2.5rem;font-size:.7rem;color:var(--sub);text-align:center}
.page-footer a{color:var(--blue);text-decoration:none;font-weight:500}

@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:440px){
  body{padding:1.8rem .9rem 4rem}
  .search-row{flex-direction:column}
  .search-btn{justify-content:center}
  .h1{font-size:1.1rem}
  .tk-card-hdr{flex-direction:column;gap:.6rem}
}
</style>
</head>
<body>

<div class="logo-wrap">
  <svg class="logo-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 394.5 116.2">
  <path fill="#2463EB" d="M115,0v24.1c0,7.9-6.4,14.2-14.2,14.2H76.7V0H115z M38.3,0H0v115h38.3V76.7h24.6c7.6,0,13.8-6.2,13.8-13.8V38.3H38.3V0z"/>
  <path fill="#606060" d="M100.1,114.5H76.5v-38h38v23.6C114.5,108.1,108.1,114.5,100.1,114.5z M175.2,116.2c9.2,0,17.5-1.9,24.9-5.8c7.4-3.8,13.1-9.4,17.4-16.6c4.2-7.2,6.3-15.6,6.3-25.1c0-9.6-2.1-17.9-6.3-25c-4.2-7.1-10-12.6-17.3-16.5c-7.3-3.8-15.6-5.8-24.8-5.8c-9.2,0-17.5,1.9-24.8,5.8c-7.3,3.8-13.1,9.3-17.3,16.5c-4.2,7.1-6.3,15.5-6.3,25c0,9.7,2.1,18.1,6.3,25.2c4.2,7.1,9.9,12.6,17.2,16.5C157.7,114.3,165.9,116.2,175.2,116.2z M175.2,88.2c-4.5,0-8.2-1.6-11-4.9c-2.9-3.3-4.3-8.1-4.3-14.5c0-6.3,1.5-11,4.4-14.3s6.6-4.9,11-4.9c4.4,0,8.1,1.6,11.1,4.9c3,3.3,4.5,8.1,4.5,14.3c0,6.3-1.5,11.1-4.5,14.4C183.4,86.5,179.7,88.2,175.2,88.2z M282.1,87.5c-2.7,0-4.7-0.5-5.8-1.6c-1.2-1.1-1.7-2.9-1.7-5.4v-31h16.8V22.6h-16.8V0.2H242v22.4h-11.4v26.8H242v30.5c0,23.4,11.8,35.1,35.4,35.1h14V87.5H282.1z M394.5,67.8c0-9.4-2-17.6-5.9-24.6c-4-7-9.4-12.3-16.5-16.1c-7-3.7-15.1-5.6-24.2-5.6c-9.2,0-17.4,1.9-24.5,5.8c-7.1,3.8-12.6,9.3-16.6,16.4c-4,7.1-5.9,15.5-5.9,25.1c0,9.7,2,18.1,6,25.2c4,7.1,9.6,12.6,16.6,16.5c7.1,3.8,15.2,5.8,24.3,5.8c7.6,0,14.5-1.4,20.8-4.3c6.3-2.9,11.4-6.8,15.6-11.8c4.1-5,6.9-10.7,8.3-17h-34.4c-2.3,4.8-6.2,7.2-11.5,7.2c-3.8,0-7-1.2-9.5-3.7c-2.5-2.5-3.9-6.2-4.2-11.3h61.1C394.4,72.8,394.5,70.3,394.5,67.8z M333.1,59.7c0.8-4.2,2.4-7.3,4.9-9.5c2.5-2.1,5.8-3.2,9.7-3.2c4,0,7.2,1.1,9.9,3.4c2.6,2.3,4,5.4,4,9.3H333.1z"/>
</svg>
  <span class="logo-tag">Suivi de commande</span>
</div>

<div class="container">
  <a href="index.html" class="back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    Retour
  </a>
  <div class="eyebrow">Kote</div>
  <h1 class="h1">Où en est ma commande ?</h1>
  <p class="sub-txt">Entrez la référence reçue après votre commande.</p>

  <div class="search-row">
    <input class="search-inp" id="trkInp" type="text" placeholder="ex : KTE-AB12CD"
      autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false"
      onkeydown="if(event.key==='Enter')doTrack()" inputmode="text">
    <button class="search-btn" id="trkBtn" onclick="doTrack()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      Rechercher
    </button>
  </div>
  <div class="search-hint">Format : <b>KTE-XXXXXX</b></div>

  <div class="tk-error" id="trkErr">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    <span id="trkErrMsg">Commande introuvable.</span>
  </div>
  <div class="tk-spin" id="trkSpin">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="15" height="15" style="opacity:.35"><path d="M21 12a9 9 0 11-6.219-8.56"/></svg>
    Recherche…
  </div>
  <div class="tk-result" id="trkResult"></div>
</div>

<div class="page-footer"><a href="index.html">Kote</a> &copy; 2026</div>

<script src="js/kote-tracking.js"></script>
<script>
function resetTracking() {
  document.getElementById('trkInp').value = '';
  const r = document.getElementById('trkResult');
  r.className = 'tk-result'; r.innerHTML = '';
  document.getElementById('trkErr').className = 'tk-error';
  document.getElementById('trkInp').focus();
}

async function doTrack() {
  const ref = document.getElementById('trkInp').value.trim().toUpperCase();
  if (!ref) { document.getElementById('trkInp').focus(); return; }
  const btn  = document.getElementById('trkBtn');
  const spin = document.getElementById('trkSpin');
  const err  = document.getElementById('trkErr');
  const res  = document.getElementById('trkResult');
  err.className='tk-error'; res.className='tk-result'; res.innerHTML='';
  btn.disabled=true; spin.className='tk-spin on';
  try {
    const ord = await TRK.lookup(ref);
    if (!ord) {
      document.getElementById('trkErrMsg').innerHTML='Référence <b>'+ref+'</b> introuvable. Vérifiez et réessayez.';
      err.className='tk-error on';
    } else {
      res.innerHTML = TRK.buildResultHTML(ord, { resetFn: 'resetTracking()' });
      res.className='tk-result on';
      res.scrollIntoView({behavior:'smooth',block:'nearest'});
    }
  } catch(e) {
    console.error('[TRK]',e);
    document.getElementById('trkErrMsg').textContent='Erreur : '+e.message;
    err.className='tk-error on';
  } finally {
    btn.disabled=false; spin.className='tk-spin';
  }
}

window.addEventListener('load', () => {
  document.getElementById('trkInp').focus();
  const ref = new URLSearchParams(location.search).get('ref');
  if (ref) { document.getElementById('trkInp').value=ref; doTrack(); }
});
</script>
</body>
</html>
