<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kote · Admin</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563EB">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kote">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

<style>
/* ══ PROVIDER DASHBOARD — scoped to provider.html ════════════ */

/* Main view container */
#vDash {
  flex: 1; overflow-y: auto; display: flex; flex-direction: column;
  padding: 1.25rem 1.4rem; gap: 0; background: var(--bg);
}
@media(max-width:640px){
  #vDash { padding: .75rem .75rem 1rem; }
  .dash-kpi { gap: .4rem; }
  .kpi-period-row { gap: .3rem; }
  .kpi-period-pills { flex-wrap: wrap; gap: 3px; }
  .kpi-period-lbl { display: none; }
  .dash-result-info { font-size: .58rem; }
  .dash-ord-hdr { padding: .5rem .65rem; }
  .dash-body-footer { flex-direction: column; gap: .4rem; }
  .dash-action-btns { flex-wrap: wrap; }
}

/* Loading / error state */
.dash-loading {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: .5rem;
  font-size: .72rem; color: var(--t3); padding: 3rem 1rem;
}

/* Stats / KPI panel */
.dash-stats { display: none; }

/* ── KPI panel ── */
.dash-kpi { display: flex; flex-direction: column; gap: .5rem; margin-bottom: 1rem; }

/* Period selector */
.kpi-period-row {
  display: flex; align-items: center; gap: .5rem; flex-wrap: wrap;
}
.kpi-period-pills { display: flex; gap: 3px; }
.kpi-pp {
  padding: 2px 9px; border-radius: var(--r); border: 1.5px solid var(--bd);
  background: var(--sf); font-family: inherit; font-size: .62rem; font-weight: 600;
  color: var(--t3); cursor: pointer; transition: all var(--ease); white-space: nowrap;
  line-height: 1.4;
}
.kpi-pp:hover { border-color: var(--bl); color: var(--bl); }
.kpi-pp.on { background: var(--bl); color: #fff; border-color: var(--bl); }
.kpi-range-row {
  display: flex; align-items: center; gap: 5px;
}
.kpi-date-inp {
  padding: 3px 7px; border: 1.5px solid var(--bd); border-radius: 6px;
  font-family: inherit; font-size: .63rem; color: var(--t1); background: var(--sf);
  cursor: pointer; transition: border-color var(--ease);
}
.kpi-date-inp:focus { border-color: var(--bl); outline: none; }
.kpi-range-sep { font-size: .7rem; color: var(--t3); }
.kpi-period-lbl {
  margin-left: auto; font-size: .6rem; color: var(--t3); font-weight: 600;
  white-space: nowrap;
}

/* Metric cards */
.kpi-cards {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: .5rem;
}
@media(max-width:760px){
  .kpi-cards { grid-template-columns: repeat(2, 1fr); }
  .kpi-pipeline { overflow-x: auto; }
  .kpi-pipe-tiles { min-width: 420px; }
}
@media(max-width:440px){
  .kpi-cards { grid-template-columns: 1fr 1fr; gap: .35rem; }
  .kpi-card  { padding: .6rem .65rem; }
  .kpi-card-val { font-size: .95rem; }
}
.kpi-card {
  background: var(--sf); border: 1.5px solid var(--bd); border-radius: 10px;
  padding: .75rem .85rem; display: flex; align-items: flex-start; gap: .6rem;
  transition: box-shadow var(--ease), border-color var(--ease);
}
.kpi-card:hover { border-color: var(--bl-md); box-shadow: 0 2px 10px rgba(37,99,235,.07); }
.kpi-card-ico {
  width: 34px; height: 34px; border-radius: 9px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.kpi-card-body { flex: 1; min-width: 0; }
.kpi-card-val {
  font-size: 1.15rem; font-weight: 800; color: var(--t1); letter-spacing: -.04em;
  line-height: 1.1; font-variant-numeric: tabular-nums;
  display: flex; align-items: baseline; gap: 5px; flex-wrap: wrap;
}
.kpi-unit { font-size: .62rem; font-weight: 600; color: var(--t3); letter-spacing: 0; }
.kpi-trend {
  font-size: .59rem; font-weight: 700; padding: 1px 6px; border-radius: 20px;
  display: inline-flex; align-items: center; gap: 2px;
}
.kpi-trend.up { background: #ecfdf5; color: #059669; }
.kpi-trend.dn { background: #fef2f2; color: #dc2626; }
.kpi-card-lbl { font-size: .63rem; font-weight: 700; color: var(--t2); margin-top: 3px; }
.kpi-card-sub { font-size: .57rem; color: var(--t3); margin-top: 1px; }

/* Pipeline tiles */
.kpi-pipeline {
  background: var(--sf); border: 1.5px solid var(--bd); border-radius: 10px;
  padding: .65rem .9rem .6rem;
}
.kpi-pipe-tiles {
  display: flex; align-items: stretch; gap: 0;
}
.kpi-tile {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: .55rem .3rem .5rem; background: none; border: none; border-right: 1px solid var(--bd);
  cursor: pointer; transition: background var(--ease); font-family: inherit;
  border-radius: 0; overflow: hidden; position: relative;
}
.kpi-tile:first-child { border-radius: 6px 0 0 6px; }
.kpi-tile:last-child  { border-right: none; border-radius: 0 6px 6px 0; }
.kpi-tile:hover { background: var(--s2); }
/* Horizontal color bar — replaces the dot, sits at top of tile */
.kpi-tile-dot {
  width: 28px; height: 3px; border-radius: 2px; flex-shrink: 0; margin-bottom: 3px;
}
.kpi-tile-num {
  font-size: 1.3rem; font-weight: 900; letter-spacing: -.05em; line-height: 1;
  font-variant-numeric: tabular-nums;
}
.kpi-tile-lbl {
  font-size: .68rem; color: var(--t2); font-weight: 600;
  text-align: center; line-height: 1.2; letter-spacing: 0;
}

/* Pipeline proportional bar */
.kpi-bar {
  display: flex; border-radius: 5px; overflow: hidden; height: 8px; background: var(--bd);
}
.kpi-bar-seg {
  height: 100%; cursor: pointer; transition: filter .14s; flex-shrink: 0;
}
.kpi-bar-seg:hover { filter: brightness(.85); }

/* ── Tabs + search row ── */
.dash-header-row {
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1.5px solid var(--bd); margin-bottom: .7rem; gap: .5rem;
  flex-wrap: wrap;
}
@media(max-width:560px){
  .dash-search-wrap { width: 100%; }
  .dash-tab-actions { width: 100%; justify-content: space-between; padding-bottom: .5rem; }
  .dash-tabs { overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .dash-tabs::-webkit-scrollbar { display: none; }
}
.dash-tabs { display: flex; align-items: center; gap: .1rem; flex-shrink: 0; }
.dash-tab-btn {
  display: flex; align-items: center; gap: 4px;
  padding: .4rem .7rem .45rem; border: none; background: transparent;
  font-family: inherit; font-size: .7rem; font-weight: 600;
  color: var(--t3); cursor: pointer; border-bottom: 2px solid transparent;
  margin-bottom: -1.5px; transition: color var(--ease), border-color var(--ease); white-space: nowrap;
}
.dash-tab-btn:hover { color: var(--t2); }
.dash-tab-btn.on    { color: var(--bl); border-bottom-color: var(--bl); }
.dash-tab-count {
  background: var(--bd); color: var(--t2); font-size: .54rem; font-weight: 700;
  padding: 1px 5px; border-radius: 10px; min-width: 14px; text-align: center;
}
.dash-tab-btn.on .dash-tab-count { background: var(--bl-lt); color: var(--bl); }

.dash-tab-actions {
  display: flex; align-items: center; gap: .4rem; flex-shrink: 0; padding-bottom: 1.5px;
}

/* Search — pill style with subtle glow */
.dash-search-wrap {
  display: flex; align-items: center;
  background: var(--s2); border: 1.5px solid var(--bd);
  border-radius: 20px; overflow: hidden; transition: all var(--ease); width: 200px;
}
.dash-search-wrap:focus-within {
  border-color: var(--bl); background: #fff;
  box-shadow: 0 0 0 3px var(--bl-lt);
}
.dash-search-ico {
  width: 12px; height: 12px; color: var(--t3); margin: 0 8px 0 10px; flex-shrink: 0;
  transition: color var(--ease);
}
.dash-search-wrap:focus-within .dash-search-ico { color: var(--bl); }
.dash-search-inp {
  flex: 1; border: none; background: none; padding: 6px 0;
  font-family: inherit; font-size: .7rem; color: var(--t1); outline: none; min-width: 0;
}
.dash-search-inp::placeholder { color: var(--t3); }
.dash-search-clear {
  display: flex; align-items: center; background: none; border: none;
  padding: 0 10px; color: var(--t3); cursor: pointer; font-size: .72rem;
  transition: color var(--ease);
}
.dash-search-clear:hover { color: var(--rd); }

.dash-refresh-btn {
  background: none; border: 1.5px solid var(--bd); border-radius: 7px;
  padding: 5px 7px; cursor: pointer; color: var(--t3); display: flex;
  align-items: center; transition: all var(--ease); flex-shrink: 0;
}
.dash-refresh-btn:hover { border-color: var(--bl); color: var(--bl); }

.dash-result-info {
  font-size: .62rem; color: var(--t3); padding: 0 0 .35rem; font-weight: 600;
}

/* Content */
.dash-content { display: flex; flex-direction: column; gap: .4rem; }

/* Empty */
.dash-empty {
  display: flex; flex-direction: column; align-items: center; gap: .5rem;
  padding: 3rem 1rem; font-size: .75rem; color: var(--t2); text-align: center;
}

/* Order cards */
.dash-ord-card {
  background: var(--sf); border: 1.5px solid var(--bd);
  border-radius: 10px; overflow: hidden; transition: border-color var(--ease), box-shadow var(--ease);
}
.dash-ord-card:hover { border-color: var(--bl-md); box-shadow: 0 2px 8px rgba(37,99,235,.06); }
.dash-ord-card.open  { border-color: var(--bl); box-shadow: 0 2px 12px rgba(37,99,235,.1); }

.dash-ord-hdr {
  display: flex; align-items: flex-start; gap: .6rem;
  padding: .6rem .8rem; cursor: pointer; user-select: none;
  transition: background var(--ease);
}
.dash-ord-hdr:hover  { background: var(--s2); }
.dash-ord-hdr-l { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.dash-ord-hdr-r { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex-shrink: 0; }
.dash-ord-ref   { font-size: .73rem; font-weight: 700; color: var(--t1);
                  display: flex; align-items: center; gap: 5px; }
.dash-ord-client{ font-size: .66rem; color: var(--t2); font-weight: 500; }
.dash-ord-chips { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 1px; }
.dash-ord-total { font-size: .75rem; font-weight: 700; color: var(--bl); }
.dash-ord-ttc   { font-size: .59rem; color: var(--t3); }
.dash-ord-date  { font-size: .57rem; color: var(--t3); margin-top: 2px; }

.dash-st-badge {
  font-size: .55rem; font-weight: 700; padding: 2px 7px;
  border-radius: 10px; border: 1px solid; text-transform: capitalize; flex-shrink: 0;
}
.brf-ref-chip {
  font-size: .58rem; font-weight: 800; font-family: 'Courier New', monospace;
  letter-spacing: .05em; color: var(--bl, #2563eb);
  background: var(--bl-lt, #ebf2ff); border: 1px solid var(--bl-md, #bfdbfe);
  padding: 1px 7px; border-radius: 10px; white-space: nowrap; flex-shrink: 0;
}
.dash-item-chip {
  font-size: .58rem; font-weight: 600; color: var(--t2);
  background: var(--s2); border: 1px solid var(--bd);
  padding: 1px 7px; border-radius: 10px; white-space: nowrap;
  display: inline-flex; align-items: center;
}
.dash-item-more { color: var(--t3); }

.dash-chev {
  width: 14px; height: 14px; color: var(--t3); flex-shrink: 0;
  transition: transform .18s; margin-top: 2px;
}
.dash-ord-card.open .dash-chev { transform: rotate(180deg); }

/* Expanded body — single column */
.dash-ord-body {
  display: none; padding: .65rem .85rem .8rem;
  border-top: 1px solid var(--bd); background: var(--s2);
}
.dash-ord-card.open .dash-ord-body { display: block; }

.dash-section-lbl {
  font-size: .55rem; font-weight: 700; color: var(--t3);
  text-transform: uppercase; letter-spacing: .8px; margin-bottom: 5px;
}
.dash-client-grid { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-bottom: 6px; }
.dash-client-item {
  display: flex; align-items: center; gap: 5px;
  font-size: .66rem; color: var(--t2);
}
.dash-client-note {
  font-size: .64rem; color: var(--am); background: #fffbeb;
  border: 1px solid #fde68a; border-radius: 5px;
  padding: 4px 8px; display: flex; align-items: center; gap: 5px; margin-top: 4px;
}
.dash-client-note svg { width: 10px; height: 10px; flex-shrink: 0; }

.dash-detail-items { display: flex; flex-direction: column; gap: 0; }
.dash-detail-row {
  display: flex; justify-content: space-between; align-items: flex-start; gap: .5rem;
  padding: .3rem 0; border-bottom: 1px solid var(--bd);
}
.dash-detail-row:last-child { border-bottom: none; }
.dash-detail-name { font-size: .67rem; font-weight: 600; color: var(--t1); }
.dash-detail-spec { font-size: .59rem; color: var(--t3); margin-top: 1px; }
.dash-detail-note { font-size: .59rem; color: var(--am); font-style: italic; }

.dash-totals-wrap { margin-top: 6px; border-top: 1px solid var(--bd); padding-top: 5px; }
.dash-totals-row {
  display: flex; justify-content: space-between; align-items: baseline;
  font-size: .66rem; padding: .18rem 0;
}
.dash-totals-ttc {
  font-size: .71rem; border-top: 1.5px solid var(--bd);
  margin-top: .2rem; padding-top: .3rem; font-weight: 700;
}

/* Card footer: status pills + action buttons */
.dash-body-footer {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: .6rem; margin-top: .7rem; padding-top: .6rem;
  border-top: 1px solid var(--bd); flex-wrap: wrap;
}
.dash-st-pills { display: flex; flex-wrap: wrap; gap: 4px; }
.dash-st-pill {
  font-size: .57rem; font-weight: 700; padding: 1px 7px;
  border-radius: var(--r); border: 1.5px solid var(--bd); cursor: pointer;
  background: var(--sf); color: var(--t3); transition: all var(--ease);
  font-family: inherit; white-space: nowrap; line-height: 1.5;
}
.dash-st-pill:hover { border-color: var(--t2); color: var(--t2); }
.dash-st-pill.act { font-weight: 800; }

.dash-action-btns { display: flex; gap: .35rem; flex-wrap: wrap; }
.dash-act-btn {
  display: flex; align-items: center; gap: 4px;
  padding: 5px 9px; border-radius: 6px; border: 1.5px solid var(--bd);
  font-family: inherit; font-size: .62rem; font-weight: 700; cursor: pointer;
  background: var(--sf); color: var(--t2); transition: all var(--ease);
}
.dash-act-btn svg { width: 11px; height: 11px; flex-shrink: 0; }
.dash-act-pdf { color: var(--bl); border-color: var(--bl-md); background: var(--bl-lt); }
.dash-act-pdf:hover { background: #dbeafe; }
.dash-act-wa  { color: #16a34a; border-color: #bbf7d0; background: #f0fdf4; }
.dash-act-wa:hover { background: #dcfce7; }
.dash-act-mail { color: #7c3aed; border-color: #ddd6fe; background: #f5f3ff; }
.dash-act-mail:hover { background: #ede9fe; }
.dash-act-mail.disabled { opacity:.4; cursor:not-allowed; pointer-events:none; }

/* Clients tab */
.dash-clients-list { display: flex; flex-direction: column; gap: .4rem; }
.dash-cli-card {
  display: flex; align-items: center; gap: .7rem;
  background: var(--sf); border: 1.5px solid var(--bd);
  border-radius: 9px; padding: .6rem .8rem;
  transition: border-color var(--ease);
}
.dash-cli-card:hover { border-color: var(--bl-md); }
.dash-cli-avatar {
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--bl-lt); color: var(--bl); font-size: .82rem;
  font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.dash-cli-info  { flex: 1; min-width: 0; }
.dash-cli-name  { font-size: .74rem; font-weight: 700; color: var(--t1); }
.dash-cli-meta  { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 2px; }
.dash-cli-meta span { font-size: .62rem; color: var(--t3); }
.dash-cli-adr   { font-size: .6rem; color: var(--t3); margin-top: 2px; }
.dash-cli-wa {
  width: 30px; height: 30px; border-radius: 7px; background: #f0fdf4;
  border: 1.5px solid #bbf7d0; color: #16a34a; display: flex;
  align-items: center; justify-content: center; text-decoration: none;
  flex-shrink: 0; transition: background var(--ease);
}
.dash-cli-wa:hover { background: #dcfce7; }
.dash-cli-wa svg { width: 14px; height: 14px; }

/* Sidebar home button */
.sb-home-btn {
  display: flex; align-items: center; gap: 7px;
  padding: .45rem .7rem; margin: .5rem .55rem .2rem;
  border-radius: 7px; border: 1.5px solid var(--bd);
  background: var(--sf); font-family: inherit; font-size: .71rem;
  font-weight: 600; color: var(--t2); cursor: pointer;
  transition: all var(--ease); width: calc(100% - 1.1rem);
}
.sb-home-btn svg { width: 13px; height: 13px; color: var(--t3); flex-shrink: 0; }
.sb-home-btn:hover { border-color: var(--bl); color: var(--bl); }
.sb-home-btn:hover svg { color: var(--bl); }
.sb-home-btn.on { background: var(--bl-lt); border-color: var(--bl-md); color: var(--bl); }
.sb-home-btn.on svg { color: var(--bl); }

</style>
</head>
<body>

<!-- ══ ADMIN TOOLBAR ══════════════════════════════════════ -->
<div class="adm-tb" id="admTb">
  <!-- Logo — populated by ADMIN._syncLogo() on boot and on shop.logo_svg change -->
  <div class="adm-tb-logo" id="admLogoSlot">

<!-- ══ SCRIPTS — load order matters ═════════════════════
     1. globals   → shared state, constants, helpers
     2. config    → Supabase credentials, DEFAULT_SOURCE
     3. db        → DB_MOD (needs config + globals)
     4. calc      → CALC pricing engine (needs globals)
     5. sections  → SECTIONS form registry (needs calc + globals)
     6. sel       → SEL dispatcher + fSel (needs globals + sections + ui)
     7. ui        → UI rendering (needs globals + calc + sections)
     8. loader    → loadProduct, loadConception, afterCheckout (needs all above)
     9. quotes    → QUOTES history panel (needs db)
    10. cart      → CART (needs globals + calc + quotes + loader)
    11. admin     → sheetSVG + ADMIN panel (needs all)
    12. invoice   → INVOICE PDF overlay (standalone, needs config for Supabase)
    13. boot      → DB_MOD.tryRestore() + SW + offline (must be last)
════════════════════════════════════════════════════════ -->

<script>
/* ── Split pane drag-to-resize ── */
(function() {
  let _dragging = false, _startY = 0, _startBotH = 0;
  const handle = document.getElementById('admSplitHandle');
  const bot    = () => document.getElementById('admSplitBottom');
  if (!handle) return;
  handle.addEventListener('mousedown', e => {
    if (!bot() || bot().style.display === 'none') return;
    _dragging = true;
    _startY   = e.clientY;
    _startBotH = bot().getBoundingClientRect().height;
    document.body.style.userSelect = 'none';
  });
  document.addEventListener('mousemove', e => {
    if (!_dragging) return;
    const delta  = _startY - e.clientY;
    const newH   = Math.max(120, Math.min(window.innerHeight * .7, _startBotH + delta));
    bot().style.height = newH + 'px';
  });
  document.addEventListener('mouseup', () => {
    _dragging = false;
    document.body.style.userSelect = '';
  });
  // Keyboard shortcut: Escape closes nav
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') ADMIN.closeNav();
  });
})();
</script>
